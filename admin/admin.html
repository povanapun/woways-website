<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woways Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000F24; --paper:#F5F7FA; --paper-dim:#E8EDF2; --teal:#00A9A9; --teal-dark:#00807F;
    --line: rgba(0,15,36,0.14); --muted: rgba(0,15,36,0.62);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Source Serif 4',serif; font-size:15.5px;}
  h1,h2,h3,button,input,textarea,label{font-family:'Space Grotesk',sans-serif;}
  .wrap{max-width:980px; margin:0 auto; padding:40px 28px 90px;}
  header{border-bottom:1px solid var(--line); padding:22px 0; margin-bottom:8px;}
  header .wrap{padding-top:0; padding-bottom:0; display:flex; justify-content:space-between; align-items:center;}
  h1{font-size:20px; font-weight:700; margin:0;}
  .tabs{display:flex; gap:10px; margin:28px 0 24px;}
  .tab-btn{
    border:1px solid var(--line); background:#fff; padding:10px 18px; border-radius:2px;
    cursor:pointer; font-size:14.5px; color:var(--ink);
  }
  .tab-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .panel{display:none;}
  .panel.active{display:block;}
  .card{background:#fff; border:1px solid var(--line); padding:26px; margin-bottom:22px; border-radius:2px;}
  .card h2{font-size:17px; margin:0 0 18px;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .field label{font-size:12.5px; color:var(--muted); text-transform:none;}
  input[type=text], textarea{
    font-family:'Source Serif 4',serif; font-size:15px; padding:9px 10px; border:1px solid var(--line);
    border-radius:2px; width:100%; background:var(--paper);
  }
  textarea{min-height:64px; resize:vertical;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .row-list{display:flex; flex-direction:column; gap:16px;}
  .save-bar{
    position:sticky; bottom:0; background:var(--paper); padding:16px 0; border-top:1px solid var(--line);
    display:flex; align-items:center; gap:16px; margin-top:20px;
  }
  button.primary{
    background:var(--teal); color:#03151A; border:none; padding:12px 22px; border-radius:2px;
    font-weight:600; cursor:pointer; font-size:14.5px;
  }
  button.primary:hover{background:var(--teal-dark); color:#fff;}
  #saveMsg{font-size:14px; color:var(--muted);}

  table{width:100%; border-collapse:collapse; background:#fff;}
  th,td{border-bottom:1px solid var(--line); padding:10px 8px; text-align:left; font-size:13.5px; vertical-align:top;}
  th{font-family:'Space Grotesk',sans-serif; font-size:12.5px; color:var(--muted); font-weight:600;}
  .leads-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  a.export-btn{
    display:inline-block; padding:9px 16px; border:1px solid var(--line); border-radius:2px; text-decoration:none;
    color:var(--ink); font-size:13.5px;
  }
  .del-btn{background:none; border:none; color:#B3261E; cursor:pointer; font-size:13px;}
  .empty{color:var(--muted); padding:24px 0;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Woways — Admin</h1>
    <span style="font-size:13px; color:var(--muted);">Content editor &amp; leads</span>
  </div>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab-btn active" data-tab="content">Site content</button>
    <button class="tab-btn" data-tab="leads">Leads</button>
  </div>

  <div class="panel active" id="panel-content">
    <div id="contentForm"></div>
    <div class="save-bar">
      <button class="primary" id="saveBtn">Save changes</button>
      <span id="saveMsg"></span>
    </div>
  </div>

  <div class="panel" id="panel-leads">
    <div class="leads-toolbar">
      <span id="leadsCount" style="color:var(--muted); font-size:14px;"></span>
      <a class="export-btn" href="/api/leads/export">Export CSV</a>
    </div>
    <div id="leadsTable"></div>
  </div>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
